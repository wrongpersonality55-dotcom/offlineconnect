<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#128C7E">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ConnectChat - Chat with Friends</title>
<style>
/* ---------- Theme tokens (light / dark) ---------- */
:root{--g:#25D366;--bar:#128C7E;--bg:#fff;--bg2:#f0f2f5;--tx:#111b21;--tx2:#667781;--out:#d9fdd3;--in:#fff;--chat:#efeae2;--line:#e9edef;--tick:#53bdeb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#202c33;--bg:#111b21;--bg2:#202c33;--tx:#e9edef;--tx2:#8696a0;--out:#005c4b;--in:#202c33;--chat:#0b141a;--line:#222d34;color-scheme:dark}}
:root[data-theme="dark"]{--bar:#202c33;--bg:#111b21;--bg2:#202c33;--tx:#e9edef;--tx2:#8696a0;--out:#005c4b;--in:#202c33;--chat:#0b141a;--line:#222d34;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background:var(--bar)}
body{background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;position:relative}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--tx)}
.i{width:24px;height:24px;fill:currentColor;flex:none}
/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.bar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 8px 10px 14px;min-height:56px}
.bar h1{font-size:20px;margin:0;flex:1;font-weight:600}
.bar .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.bar .ib:active{background:#fff3}
/* ---------- Onboarding ---------- */
#onb{overflow:auto;align-items:center;padding:28px 22px}
#onb .box{width:100%;max-width:420px}
#onb h2{text-align:center;color:var(--bar);margin:0 0 4px}
#onb p.s{text-align:center;color:var(--tx2);margin:0 0 20px}
.pic{width:112px;height:112px;border-radius:50%;background:var(--bg2);margin:0 auto 22px;display:grid;place-items:center;position:relative;color:var(--tx2);cursor:pointer;background-size:cover;background-position:center}
.pic .cam{position:absolute;right:0;bottom:2px;background:var(--g);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.fld{display:block;margin-bottom:14px}
.fld span{font-size:12px;color:var(--bar)}
.fld input{width:100%;border:0;border-bottom:2px solid var(--line);background:none;padding:8px 2px;outline:0}
.fld input:focus{border-color:var(--g)}
.btn{background:var(--g);color:#06361b;font-weight:600;border-radius:24px;padding:12px 22px;width:100%}
.btn.sm{width:auto;padding:7px 16px;font-size:13px}
.btn.o{background:var(--bg2);color:var(--tx)}
/* ---------- Home ---------- */
.tabs{display:flex;background:var(--bar);color:#ffffffb3}
.tabs button{flex:1;padding:12px 0;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-color:var(--g)}
#sb{display:none;background:var(--bar);padding:0 12px 10px}
#sb input{width:100%;border:0;border-radius:20px;padding:9px 14px;background:#fff;color:#111;outline:0}
#list{flex:1;overflow:auto}
.row{display:flex;gap:14px;padding:10px 16px;align-items:center;cursor:pointer}
.row:active{background:var(--bg2)}
.row .mid{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:-10px}
.row .t{display:flex;justify-content:space-between;gap:8px}
.row b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small,.sub{color:var(--tx2)}
.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;display:block}
.badge{background:var(--g);color:#06361b;border-radius:11px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:700;display:grid;place-items:center}
.av{width:48px;height:48px;border-radius:50%;background:var(--bar);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;background-size:cover;background-position:center;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--g);border:2px solid var(--bg)}
.empty{padding:48px 28px;text-align:center;color:var(--tx2)}
.info{margin:12px;padding:12px 14px;border-radius:12px;background:var(--bg2);font-size:13.5px;color:var(--tx2)}
.info b{color:var(--tx)}
.fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--g);color:#06361b;display:grid;place-items:center;box-shadow:0 4px 14px #0004}
/* ---------- Chat ---------- */
#msgs{flex:1;overflow:auto;padding:10px 8px;background:var(--chat);display:flex;flex-direction:column;gap:3px}
.m{max-width:80%;padding:6px 8px 4px;border-radius:10px;background:var(--in);align-self:flex-start;box-shadow:0 1px 1px #0002;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{background:var(--out);align-self:flex-end}
.m .nm{font-size:12px;font-weight:700;color:var(--bar)}
.m img{max-width:100%;max-height:260px;border-radius:6px;display:block}
.m audio{width:230px;max-width:100%;height:38px}
.m a.f{display:flex;gap:8px;align-items:center;color:inherit;text-decoration:none;background:#0001;padding:8px;border-radius:8px}
.m .mt{font-size:11px;color:var(--tx2);text-align:right;display:flex;gap:3px;justify-content:flex-end;align-items:center}
.m .mt .i{width:17px;height:17px}
.m .mt .d{color:var(--tick)}
.sys{align-self:center;background:#fff9;color:#444;font-size:12px;padding:4px 10px;border-radius:8px}
#emo{display:none;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;background:var(--bg2);max-height:190px;overflow:auto;font-size:24px;text-align:center}
#emo.on{display:grid}
#emo span{cursor:pointer;padding:4px 0}
.comp{display:flex;gap:6px;padding:6px 8px;background:var(--chat);align-items:flex-end}
.comp .box{flex:1;background:var(--bg);border-radius:24px;display:flex;align-items:center;padding:2px 6px;min-height:46px;color:var(--tx2)}
.comp textarea{flex:1;border:0;background:none;resize:none;outline:0;max-height:100px;padding:10px 6px;height:42px}
.comp .ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.comp .go{width:46px;height:46px;border-radius:50%;background:var(--g);color:#06361b;display:grid;place-items:center}
#rec{display:none;flex:1;align-items:center;gap:8px;color:#e53935;padding:0 8px}
#rec i{width:10px;height:10px;border-radius:50%;background:#e53935;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#rec i{animation:none}}
/* ---------- Menu / sheet / toast ---------- */
#menu{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg);color:var(--tx);border-radius:10px;box-shadow:0 4px 20px #0005;display:none;z-index:30;min-width:200px;padding:6px 0}
#menu.on{display:block}
#menu button{display:block;width:100%;text-align:left;padding:12px 18px}
#menu button:active{background:var(--bg2)}
#sheet{position:absolute;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:40}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
#sheet h3{margin:0 0 6px}
#sheet textarea,#sheet input.t{width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:9px;margin:6px 0 10px;min-height:70px;font-size:12px}
#sheet input.t{min-height:0;font-size:15px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;display:none;z-index:50;max-width:90%;text-align:center}
</style>
</head>

<!-- ============ ONBOARDING ============ -->
<section id="onb" class="screen">
  <div class="box">
    <h2>Welcome to ConnectChat</h2>
    <p class="s">Chat with friends using their phone number. Your number is your ID.</p>
    <div class="pic" id="pic"><svg class="i" style="width:48px;height:48px"><use href="#cam"/></svg><span class="cam"><svg class="i" style="width:18px;height:18px"><use href="#cam"/></svg></span></div>
    <input type="file" id="picIn" accept="image/*" hidden>
    <label class="fld"><span>Phone number</span><input id="fPhone" type="tel" placeholder="+92 300 1234567"></label>
    <label class="fld"><span>Your name</span><input id="fName" maxlength="30" placeholder="Name"></label>
    <label class="fld"><span>Bio</span><input id="fBio" maxlength="80" placeholder="Hey there! I am using ConnectChat"></label>
    <button class="btn" id="fGo">Save and continue</button>
  </div>
</section>

<!-- ============ HOME ============ -->
<section id="home" class="screen">
  <div class="bar"><h1>ConnectChat</h1>
    <button class="ib" id="bSearch" aria-label="Search"><svg class="i"><use href="#search"/></svg></button>
    <button class="ib" id="bMenu" aria-label="Menu"><svg class="i"><use href="#more"/></svg></button></div>
  <div id="sb"><input id="q" placeholder="Search chats"></div>
  <div class="tabs"><button data-t="chats" class="on">Chats</button><button data-t="groups">Groups</button><button data-t="nearby">Friends</button></div>
  <div id="list"></div>
  <button class="fab" id="fab" aria-label="Add friend"><svg class="i"><use href="#add"/></svg></button>

<!-- ============ CHAT ============ -->
<section id="chat" class="screen">
  <div class="bar"><button class="ib" id="cBack" aria-label="Back"><svg class="i"><use href="#back"/></svg></button>
    <div class="av" id="cAv" style="width:40px;height:40px;font-size:16px"></div>
    <div style="flex:1;min-width:0;margin-left:6px"><div id="cName" style="font-weight:600"></div><div id="cSt" style="font-size:12px;opacity:.85"></div></div></div>

    <div class="box">
      <button class="ib" id="bEmo" aria-label="Emoji"><svg class="i"><use href="#emoji"/></svg></button>

      <div id="rec"><i></i><span id="recT">0:00</span><button id="recX" aria-label="Cancel"><svg class="i"><use href="#x"/></svg></button></div>
      <button class="ib" id="bFile" aria-label="Send file"><svg class="i"><use href="#clip"/></svg></button>
      <button class="ib" id="bImg" aria-label="Send image"><svg class="i"><use href="#img"/></svg></button>
    </div>

  </div>
  <input type="file" id="imgIn" accept="image/*" hidden><input type="file" id="fileIn" hidden>
</section>

<div id="menu"></div><div id="sheet"></div><div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   ConnectChat - single-file PWA
   Storage : IndexedDB (chats + messages), localStorage (profile, theme)
   Transport: WebRTC DataChannel with NO STUN/TURN servers (host candidates
              only), so it works on the same WiFi / hotspot / WiFi Direct
              link without internet.
   Discovery: BroadcastChannel (same device/browser tabs, auto) +
              copy/paste connection codes (any two devices) +
              Web Bluetooth scan (shows nearby BT devices).
   ===================================================================== */

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const ic = n => `<svg class="i"><use href="#${n}"/></svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } }
};
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", 3200); }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
const readURL = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
/* Downscale an image file to keep storage and transfers small */
async function shrink(file, max) {
  const url = await readURL(file);
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k;
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .8));
    };
    im.onerror = () => res(url); im.src = url;
  });
}
function avatar(o, extra = "") {
  const bg = o.av ? `style="background-image:url('${o.av}')"` : "";
  return `<div class="av ${extra}" ${bg}>${o.av ? "" : esc((o.name || "?")[0].toUpperCase())}</div>`;
}

/* ---------- IndexedDB (offline message store) ---------- */
let DB;
const openDB = () => new Promise((ok, no) => {
  const r = indexedDB.open("offlineconnect", 1);
  r.onupgradeneeded = () => {
    r.result.createObjectStore("chats", { keyPath: "id" });
    r.result.createObjectStore("msgs", { keyPath: "id" }).createIndex("chat", "chat");
  };
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const rq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const st = (s, w) => DB.transaction(s, w ? "readwrite" : "readonly").objectStore(s);
const dbPut = (s, v) => rq(st(s, 1).put(v));
const dbAll = s => rq(st(s).getAll());
const dbMsgs = c => rq(st("msgs").index("chat").getAll(c));

/* ---------- State ---------- */
let me, chats = [], cur = null, tab = "chats";
let conns = [];            // live P2P connections {pc, dc, id, user}
const nearby = {};         // discovered users {id,name,bio,av}
const pending = {};        // outgoing offers waiting for an answer
let btDevices = [];        // Bluetooth devices found by scan

/* ---------- Theme ---------- */
function setTheme(t) { if (t) document.documentElement.dataset.theme = t; LS.set("oc_theme", t); }
setTheme(LS.get("oc_theme"));

/* ---------- Onboarding ---------- */
let newAv = null;
function openOnboarding() {
  $("#fPhone").value = me?.phone || ""; $("#fName").value = me?.name || ""; $("#fBio").value = me?.bio || "";
  newAv = me?.av || null; $("#pic").style.backgroundImage = newAv ? `url('${newAv}')` : "";
  show("onb");
}
$("#pic").onclick = () => $("#picIn").click();
$("#picIn").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  newAv = await shrink(f, 256); $("#pic").style.backgroundImage = `url('${newAv}')`;
};
$("#fGo").onclick = () => {
  const phone = $("#fPhone").value.trim(), name = $("#fName").value.trim();
  if (!phone || !name) return toast("Phone number and name are required");
  me = { id: me?.id || uid(), phone, name, bio: $("#fBio").value.trim() || "Hey there! I am using ConnectChat", av: newAv };
  LS.set("oc_me", me); goHome(); startPeer();
};

/* ---------- Home ---------- */
function goHome() { cur = null; show("home"); render(); }
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.t));
function setTab(t) {
  tab = t; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); render();
}
$("#bSearch").onclick = () => { const s = $("#sb"); s.style.display = s.style.display === "block" ? "none" : "block"; if (s.style.display === "block") $("#q").focus(); };
$("#q").oninput = render;
$("#fab").onclick = () => setTab("nearby");

const isOn = id => conns.some(c => c.id === id && c.dc?.readyState === "open");
function render() {
  if (cur) return;
  const el = $("#list"), q = $("#q").value.toLowerCase();
  if (tab === "nearby") return renderNearby(el);
  const rows = chats.filter(c => !!c.group === (tab === "groups") && c.name.toLowerCase().includes(q)).sort((a, b) => b.time - a.time);
  const addBtn = tab === "groups" ? `<div style="padding:12px 16px"><button class="btn sm" onclick="newGroup()">Create group</button></div>` : "";
  el.innerHTML = addBtn + (rows.length ? rows.map(c => `
    <div class="row" data-id="${c.id}">${avatar(c, isOn(c.id) ? "on" : "")}
      <div class="mid"><div class="t"><b>${esc(c.name)}</b><small>${c.time ? fmt(c.time) : ""}</small></div>
      <div class="t"><span class="sub">${esc(c.last || c.bio || "")}</span>${c.unread ? `<span class="badge">${c.unread}</span>` : ""}</div></div></div>`).join("")
    : `<div class="empty"><b>${tab === "groups" ? "No groups yet" : "No chats yet"}</b><br>Tap the Bluetooth button to find friends nearby and start chatting.</div>`);
  el.querySelectorAll(".row").forEach(r => r.onclick = () => openChat(r.dataset.id));
}
function renderNearby(el) {
  const users = Object.values(nearby);
  el.innerHTML = `
    <div class="info"><b>Internet is needed.</b><br>You and your friend must both open the app. Type their phone number (the one in their profile) and tap Connect.</div>
    <div style="display:flex;gap:8px;padding:0 12px 10px"><input id="fPh" type="tel" placeholder="Friend's phone number" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:10px 14px;outline:0"><button class="btn sm" id="bAdd">Connect</button></div>
    ${users.map(u => `<div class="row">${avatar(u, isOn(u.id) ? "on" : "")}<div class="mid"><b>${esc(u.name)}</b><span class="sub">${esc(u.bio || "")}</span></div>
      ${isOn(u.id) ? `<button class="btn sm" data-chat="${u.id}">Chat</button>` : `<button class="btn sm" data-con="${esc(u.phone || "")}">Connect</button>`}</div>`).join("")}
    ${users.length ? "" : `<div class="empty">No friends connected yet.</div>`}`;
  $("#bAdd").onclick = () => connectTo($("#fPh").value);
  el.querySelectorAll("[data-con]").forEach(b => b.onclick = () => connectTo(b.dataset.con));
  el.querySelectorAll("[data-chat]").forEach(b => b.onclick = () => openChat(b.dataset.chat));
}

/* ---------- Menu ---------- */
$("#bMenu").onclick = e => {
  e.stopPropagation();
  const dark = getComputedStyle(document.documentElement).colorScheme === "dark";
  $("#menu").innerHTML = `<button data-a="grp">New group</button><button data-a="code">Add friend</button><button data-a="theme">${dark ? "Light mode" : "Dark mode"}</button><button data-a="prof">Edit profile</button><button data-a="help">How it works</button>`;
  $("#menu").classList.add("on");
};
document.addEventListener("click", () => $("#menu").classList.remove("on"));
$("#menu").onclick = e => {
  const a = e.target.dataset.a; if (!a) return;
  if (a === "grp") newGroup(); if (a === "code") setTab("nearby"); if (a === "prof") openOnboarding(); if (a === "help") helpSheet();
  if (a === "theme") setTheme(getComputedStyle(document.documentElement).colorScheme === "dark" ? "light" : "dark");
};
function sheet(html) { const s = $("#sheet"); s.innerHTML = `<div class="in">${html}</div>`; s.classList.add("on"); }
$("#sheet").onclick = e => { if (e.target.id === "sheet") e.target.classList.remove("on"); };
const closeSheet = () => $("#sheet").classList.remove("on");
function helpSheet() {
  sheet(`<h3>How it works</h3><p class="sub" style="white-space:normal">Your phone number is your ID. Open the Friends tab, type your friend's number and tap Connect. Messages go straight from phone to phone. Chats are saved on your phone, and unsent messages go out when your friend comes online.</p><button class="btn" onclick="closeSheet()">Got it</button>`);
}
function newGroup() {
  sheet(`<h3>New group</h3><input class="t" id="gName" placeholder="Group name" maxlength="30"><p class="sub" style="white-space:normal">Group messages go to everyone you are connected with.</p><button class="btn" id="gOk">Create group</button>`);
  $("#gOk").onclick = async () => {
    const name = $("#gName").value.trim(); if (!name) return;
    const c = { id: "g" + uid(), name, group: true, time: Date.now(), last: "Group created", unread: 0 };
    chats.push(c); await dbPut("chats", c); closeSheet(); setTab("groups");
  };
}

/* ---------- Chat screen ---------- */
const EMOJI = "😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😅 😭 😡 👍 👎 🙏 👏 🙌 💪 🔥 ❤️ 💔 🎉 ✨ 🌹 😴 🤝 👋 😇 🥳 😢 😮 🤗 🍕 ☕ 🎵 ⚽ 🚗 🏠 📞 ✅".split(" ");
$("#emo").innerHTML = EMOJI.map(e => `<span>${e}</span>`).join("");
$("#emo").onclick = e => { if (e.target.tagName === "SPAN") { $("#txt").value += e.target.textContent; syncBtn(); } };
$("#bEmo").onclick = () => $("#emo").classList.toggle("on");
$("#cBack").onclick = goHome;

async function openChat(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  cur = id; c.unread = 0; await dbPut("chats", c);
  const a = $("#cAv"); a.style.backgroundImage = c.av ? `url('${c.av}')` : ""; a.textContent = c.av ? "" : c.name[0].toUpperCase();
  $("#cName").textContent = c.name; show("chat"); header(); drawMsgs();
  if (!c.group && !isOn(c.id) && c.phone) connectTo(c.phone);
}
function header() {
  const c = chats.find(x => x.id === cur); if (!c) return;
  $("#cSt").textContent = c.group ? `${conns.filter(k => k.dc?.readyState === "open").length} connected` : isOn(c.id) ? "online" : "not connected - messages will send later";
}
async function drawMsgs() {
  const list = (await dbMsgs(cur)).sort((a, b) => a.time - b.time), c = chats.find(x => x.id === cur), box = $("#msgs");
  box.innerHTML = `<div class="sys">Messages are saved on this phone.</div>` + list.map(m => {
    let body = "";
    if (m.kind === "image") body = `<img src="${m.data}" alt="">`;
    else if (m.kind === "audio") body = `<audio controls src="${m.data}"></audio>`;
    else if (m.kind === "file") body = `<a class="f" download="${esc(m.name)}" href="${m.data}">${ic("file")}<span>${esc(m.name)}</span></a>`;
    if (m.text) body += `<div>${esc(m.text)}</div>`;
    const tick = m.me ? `<span class="${m.st === "delivered" ? "d" : ""}">${ic(m.st === "delivered" ? "tick2" : "tick")}</span>` : "";
    return `<div class="m ${m.me ? "me" : ""}">${c.group && !m.me ? `<div class="nm">${esc(m.from || "")}</div>` : ""}${body}<div class="mt">${fmt(m.time)}${tick}</div></div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}
const syncBtn = () => $("#bSend").innerHTML = ic($("#txt").value.trim() ? "send" : "mic");
$("#txt").oninput = e => { syncBtn(); e.target.style.height = "42px"; e.target.style.height = Math.min(100, e.target.scrollHeight) + "px"; };
$("#txt").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && innerWidth > 700) { e.preventDefault(); $("#bSend").click(); } };

/* Save a message locally, update chat row, redraw */
async function saveMsg(m, preview) {
  await dbPut("msgs", m);
  const c = chats.find(x => x.id === m.chat);
  if (c) { c.last = (m.me ? "" : "") + preview; c.time = m.time; if (!m.me && cur !== c.id) c.unread = (c.unread || 0) + 1; await dbPut("chats", c); }
  if (cur === m.chat) drawMsgs(); else render();
}
const PREV = { image: "📷 Photo", audio: "🎤 Voice message", file: "📎 File" };
async function sendMsg(kind, text, data, name) {
  const c = chats.find(x => x.id === cur); if (!c) return;
  const m = { id: uid(), chat: cur, me: true, kind, text, data, name, time: Date.now(), st: "sent", from: me.name };
  await saveMsg(m, text || PREV[kind]);
  const targets = c.group ? conns.filter(k => k.dc?.readyState === "open") : conns.filter(k => k.id === cur && k.dc?.readyState === "open");
  if (!targets.length) { toast("Saved. Will send when your friend is online."); if (!c.group && c.phone) connectTo(c.phone); }
  targets.forEach(k => transmit(k, m, c.group ? { id: c.id, name: c.name } : null));
}
$("#bSend").onclick = () => {
  const v = $("#txt").value.trim();
  if (v) { sendMsg("text", v); $("#txt").value = ""; $("#txt").style.height = "42px"; $("#emo").classList.remove("on"); syncBtn(); }
  else toggleRec();
};
$("#bImg").onclick = () => $("#imgIn").click();
$("#bFile").onclick = () => $("#fileIn").click();
$("#imgIn").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f) sendMsg("image", "", await shrink(f, 1024), f.name); };
$("#fileIn").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (f.size > 8e6) return toast("File too large (max 8 MB)");
  sendMsg("file", "", await readURL(f), f.name);
};

/* ---------- Voice notes ---------- */
let rec, recChunks, recTimer, recCancel;
async function toggleRec() {
  if (rec) { rec.stop(); return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(s); recChunks = []; recCancel = false; let t0 = Date.now();
    rec.ondataavailable = e => recChunks.push(e.data);
    rec.onstop = async () => {
      s.getTracks().forEach(t => t.stop()); clearInterval(recTimer); rec = null;
      $("#rec").style.display = "none"; $("#txt").style.display = "";
      if (!recCancel) sendMsg("audio", "", await readURL(new Blob(recChunks, { type: recChunks[0]?.type || "audio/webm" })));
    };
    rec.start(); $("#txt").style.display = "none"; $("#rec").style.display = "flex";
    recTimer = setInterval(() => { const d = (Date.now() - t0) / 1000 | 0; $("#recT").textContent = `${d / 60 | 0}:${String(d % 60).padStart(2, "0")}`; }, 500);
    $("#bSend").innerHTML = ic("send");
  } catch { toast("Microphone permission needed for voice notes"); }
}
$("#recX").onclick = () => { recCancel = true; rec?.stop(); };

/* ---------- Internet P2P: PeerJS cloud (signaling) + WebRTC ---------- */
let peer = null, peerRetry = 0;
const key = p => "oc-" + String(p).replace(/\D/g, "").slice(-10);   // phone -> peer id (last 10 digits)
function startPeer() {
  if (!me) return;
  try { peer?.destroy(); } catch { }
  conns = [];
  if (typeof Peer === "undefined") return toast("Internet is needed to go online");
  peer = new Peer(key(me.phone));
  peer.on("open", () => { peerRetry = 0; toast("You are online"); });
  peer.on("connection", wirePeer);
  peer.on("disconnected", () => { try { peer.reconnect(); } catch { } });
  peer.on("error", e => {
    const t = e.type;
    if (t === "unavailable-id") {                      // old session may still be held by the server for a few seconds
      if (peerRetry++ < 5) { toast("Reconnecting your number..."); setTimeout(startPeer, 4000); }
      else toast("This number is already online on another device or tab");
    }
    else if (t === "peer-unavailable") toast("Friend is offline or the number is wrong");
    else if (["network", "server-error", "socket-error", "socket-closed"].includes(t)) toast("Cannot reach the connection server. Check your internet and try again.");
    else if (t === "webrtc") toast("Direct connection failed. Try again, or switch WiFi / mobile data.");
    else toast("Connection error: " + t);
  });
}
addEventListener("online", () => { if (peer && peer.disconnected) try { peer.reconnect(); } catch { } });
function connectTo(phone) {
  const id = key(phone);
  if (id.length < 6) return toast("Enter a valid phone number");
  if (!peer || !peer.open) return toast("Not online yet. Check your internet.");
  if (id === key(me.phone)) return toast("That is your own number");
  if (conns.some(c => c.conn.peer === id && c.conn.open)) return toast("Already connected");
  toast("Connecting...");
  const cn = peer.connect(id, { reliable: true, serialization: "json" }); wirePeer(cn);
  setTimeout(() => { if (!cn.open) toast("Still not connected. Friend may be offline or on a strict network. Try again."); }, 15000);
}
/* Wrap a PeerJS connection so the chat code can send/receive framed data */
function wirePeer(conn) {
  const c = { conn, dc: { get readyState() { return conn.open ? "open" : "closed"; }, get bufferedAmount() { return conn.dataChannel ? conn.dataChannel.bufferedAmount : 0; }, send: s => conn.send(s) } };
  conns.push(c); const buf = {};
  const hello = () => sendRaw(c, { t: "hello", id: me.id, phone: me.phone, name: me.name, bio: me.bio, av: me.av });
  conn.on("open", hello); if (conn.open) hello();
  conn.on("data", s => {                               // reassemble framed chunks
    const f = JSON.parse(s); (buf[f.m] ||= []).push(f);
    if (buf[f.m].length === f.n) { const t = buf[f.m].sort((a, b) => a.i - b.i).map(x => x.d).join(""); delete buf[f.m]; onData(c, JSON.parse(t)); }
  });
  const gone = () => { conns = conns.filter(k => k !== c); header(); render(); };
  conn.on("close", gone); conn.on("error", () => { toast("Could not connect to your friend. Ask them to open the app and try again."); gone(); });
}
/* Send any object, split into 12 KB frames */
async function sendRaw(c, obj) {
  const s = JSON.stringify(obj), n = Math.ceil(s.length / 12000) || 1, m = uid();
  for (let i = 0; i < n; i++) {
    while (c.dc.bufferedAmount > 1e6) await new Promise(r => setTimeout(r, 40));
    c.dc.send(JSON.stringify({ m, i, n, d: s.slice(i * 12000, (i + 1) * 12000) }));
  }
}
const transmit = (c, m, g) => sendRaw(c, { t: "msg", id: m.id, kind: m.kind, text: m.text, data: m.data, name: m.name, time: m.time, from: me.name, uid: me.id, g });

async function onData(c, d) {
  if (d.t === "hello") {
    c.id = d.id; nearby[d.id] = { id: d.id, name: d.name, bio: d.bio, av: d.av, phone: d.phone };
    let ch = chats.find(x => x.id === d.id);
    if (!ch) { ch = { id: d.id, name: d.name, bio: d.bio, av: d.av, phone: d.phone, time: Date.now(), last: "Connected", unread: 0 }; chats.push(ch); }
    else Object.assign(ch, { name: d.name, bio: d.bio, av: d.av, phone: d.phone });
    await dbPut("chats", ch); toast(`Connected with ${d.name}`);
    for (const m of (await dbMsgs(d.id)).filter(m => m.me && m.st === "sent")) transmit(c, m, null); // send queued messages
    header(); render();
  } else if (d.t === "msg") {
    const chatId = d.g ? d.g.id : d.uid;
    if (d.g && !chats.find(x => x.id === chatId)) { const g = { id: chatId, name: d.g.name, group: true, time: Date.now(), unread: 0 }; chats.push(g); await dbPut("chats", g); }
    if (!(await rq(st("msgs").get(d.id)))) await saveMsg({ id: d.id, chat: chatId, me: false, kind: d.kind, text: d.text, data: d.data, name: d.name, time: d.time, from: d.from }, d.text || PREV[d.kind]);
    sendRaw(c, { t: "ack", id: d.id });                // tell sender: delivered
    if (document.hidden) try { navigator.vibrate?.(80); } catch { }
  } else if (d.t === "ack") {
    const m = await rq(st("msgs").get(d.id)); if (m) { m.st = "delivered"; await dbPut("msgs", m); if (cur === m.chat) drawMsgs(); }
  }
}

/* ---------- PWA: manifest (generated) + service worker ---------- */
(function pwa() {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
    x.fillStyle = "#25D366"; x.fillRect(0, 0, 512, 512); x.fillStyle = "#fff"; x.font = "bold 300px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("OC", 256, 270);
    const icon = c.toDataURL("image/png");
    const mf = { name: "ConnectChat - Chat with Friends", short_name: "ConnectChat", display: "standalone", background_color: "#ffffff", theme_color: "#128C7E", start_url: ".", icons: [{ src: icon, sizes: "512x512", type: "image/png", purpose: "any maskable" }] };
    const l = document.createElement("link"); l.rel = "manifest"; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: "application/manifest+json" })); /* real manifest.json is linked in <head> */
  } catch { }
  /* Needs a real file next to this page, served over HTTPS or localhost.
     sw.js:
       const C="oc-v1";
       self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.add("./")).then(()=>self.skipWaiting())));
       self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
       self.addEventListener("fetch",e=>e.respondWith(fetch(e.request).then(r=>{const k=r.clone();caches.open(C).then(c=>c.put(e.request,k));return r}).catch(()=>caches.match(e.request))));
  */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => { });
})();

/* ---------- Boot ---------- */
(async function init() {
  me = LS.get("oc_me");
  try { DB = await openDB(); chats = await dbAll("chats"); } catch { toast("Storage unavailable: chats will not be saved"); DB = null; }
  syncBtn(); me ? (goHome(), startPeer()) : openOnboarding();
})();
</script>
